[project]
name = "cxcreditguard"
version = "0.1.0"
description = "Self-hosted governance utility for Checkmarx One AI credit consumption"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "httpx>=0.27",
    "cryptography>=42.0",
    "argon2-cffi>=23.1",
    "pyotp>=2.9",
    "python-multipart>=0.0.9",
    "apscheduler>=3.10",
    "email-validator>=2.1",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "pip-audit>=2.7",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "C4", "SIM"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
# S105/S106/S107 flag string literals that look like credentials. In these two
# places they are key-derivation purpose labels and test fixtures, not secrets.
"app/core/crypto.py" = ["S105"]
"app/services/settings_store.py" = ["S105"]
# B008 flags calls in argument defaults. FastAPI's File() and Depends() are meant
# to be used exactly that way.
"app/api/routes/*" = ["B008"]
"tests/*" = ["S105", "S106", "S107", "S311"]
# The demo seeder's randomness shapes a chart, it is not a security decision.
"scripts/*" = ["S311"]
"alembic/*" = ["E501"]
