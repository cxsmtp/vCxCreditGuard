name: Release

# Publishes the single-container image to the PRIVATE package
# ghcr.io/cxsmtp/vcxcreditguard when a version tag is pushed, and only then:
#
#   git tag -a v1.2.3 -m "What changed, in a few lines"   # the notes shown in the app
#   git push origin v1.2.3
#
# Installations read it with a read-only token (read:packages) entered on
# Settings -> Updates, and install the app layer in place (see README "Updates").

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/cxsmtp/vcxcreditguard
  # Keep in step with the default in deploy/podman/Dockerfile.
  PYTHON_IMAGE: python:3.11-alpine

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          # The annotated tag's message is the release notes.
          fetch-depth: 0

      - name: Version from the tag
        id: version
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]{1,4}\.[0-9]{1,4}\.[0-9]{1,4}$'; then
            echo "::error::$tag is not a release tag (vX.Y.Z)"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Stamp the version into the app
        # app/__init__.py is the one place the version lives; the tag decides it.
        run: |
          sed -i -E "s/^__version__ = .*/__version__ = \"${{ steps.version.outputs.version }}\"/" backend/app/__init__.py
          grep -q "^__version__ = \"${{ steps.version.outputs.version }}\"$" backend/app/__init__.py

      - name: Release notes
        id: notes
        run: |
          version="${{ steps.version.outputs.version }}"
          notes=""
          if [ -f CHANGELOG.md ]; then
            # The "## <version>" (or "## v<version>") section, if there is one.
            notes="$(awk -v v="$version" '
              /^## / { if (found) exit; if ($2 == v || $2 == "v" v || $2 == "[" v "]") { found = 1; next } }
              found { print }' CHANGELOG.md)"
          fi
          if [ -z "$notes" ]; then
            notes="$(git for-each-ref "refs/tags/${GITHUB_REF_NAME}" --format='%(contents)' | sed '/-----BEGIN PGP SIGNATURE-----/,$d')"
          fi
          printf '%s' "$notes" | head -c 3500 > "$RUNNER_TEMP/notes.txt"

      - name: Dependency hash
        # The same function the image build runs (cxcg_launcher.py image-info).
        id: deps
        run: |
          hash="$(python3 backend/cxcg_launcher.py deps-hash \
            --constraints backend/constraints.txt --pyproject backend/pyproject.toml \
            --base-image "$PYTHON_IMAGE" --launcher backend/cxcg_launcher.py \
            --entrypoint deploy/podman/easy-entrypoint.sh)"
          echo "hash=$hash" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build the release manifest
        run: |
          docker buildx build -f deploy/podman/Dockerfile \
            --build-arg PYTHON_IMAGE="$PYTHON_IMAGE" \
            --build-arg CXCG_REVISION="$GITHUB_SHA" \
            --target release-manifest --output type=local,dest="$RUNNER_TEMP/manifest" .
          python3 -c "import json,sys; m=json.load(open(sys.argv[1])); print(m['version'], len(m['files']), 'files'); assert m['version']==sys.argv[2]; assert m['deps_hash']==sys.argv[3]" \
            "$RUNNER_TEMP/manifest/release-manifest.json" "${{ steps.version.outputs.version }}" "${{ steps.deps.outputs.hash }}"

      - name: Sign the release manifest
        id: sign
        env:
          SIGNING_KEY: ${{ secrets.CXCG_RELEASE_SIGNING_KEY }}
        run: |
          if [ -z "$SIGNING_KEY" ]; then
            echo "::warning::CXCG_RELEASE_SIGNING_KEY is not set: this release is published UNSIGNED."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "signature=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 -m pip install --quiet "cryptography==$(grep -i '^cryptography==' backend/constraints.txt | cut -d= -f3)"
          umask 077
          printf '%s\n' "$SIGNING_KEY" > "$RUNNER_TEMP/key.pem"
          signature="$(cd backend && python3 -m scripts.release_manifest sign \
            --manifest "$RUNNER_TEMP/manifest/release-manifest.json" --key-file "$RUNNER_TEMP/key.pem")"
          rm -f "$RUNNER_TEMP/key.pem"
          # The public key committed in the app must verify it, or installations refuse it.
          (cd backend && python3 -m scripts.release_manifest verify \
            --manifest "$RUNNER_TEMP/manifest/release-manifest.json" --signature "$signature")
          echo "signed=true" >> "$GITHUB_OUTPUT"
          echo "signature=$signature" >> "$GITHUB_OUTPUT"

      - name: Build the image
        run: |
          docker buildx build -f deploy/podman/Dockerfile --load -t cxcreditguard:release \
            --build-arg PYTHON_IMAGE="$PYTHON_IMAGE" \
            --build-arg CXCG_REVISION="$GITHUB_SHA" \
            --build-arg CXCG_RELEASE_SIGNATURE="${{ steps.sign.outputs.signature }}" \
            --label "org.opencontainers.image.version=${{ steps.version.outputs.version }}" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.title=CxCreditGuard" \
            --label "io.cxcreditguard.deps=${{ steps.deps.outputs.hash }}" \
            --label "io.cxcreditguard.signed=${{ steps.sign.outputs.signed }}" \
            --label "io.cxcreditguard.release-notes=$(cat "$RUNNER_TEMP/notes.txt")" \
            .

      - name: Check the image
        # It starts through the launcher, answers its health check with the
        # tagged version, and its dependency hash is the one in the label.
        run: |
          version="${{ steps.version.outputs.version }}"
          inside="$(docker run --rm --entrypoint cat cxcreditguard:release /usr/local/share/cxcreditguard/image.json)"
          echo "$inside" | grep -q "\"deps_hash\": \"${{ steps.deps.outputs.hash }}\"" \
            || { echo "::error::the image's dependency hash differs from the label"; echo "$inside"; exit 1; }
          docker run -d --name release-check -p 127.0.0.1:8000:8000 cxcreditguard:release
          for _ in $(seq 1 40); do
            body="$(curl -s http://127.0.0.1:8000/healthz || true)"
            echo "$body" | grep -q "\"version\":\"$version\"" && break
            sleep 3
          done
          docker logs release-check 2>&1 | tail -n 20
          echo "$body" | grep -q "\"version\":\"$version\"" || { echo "::error::did not come up as $version"; exit 1; }
          docker rm -f release-check

      - name: Push
        run: |
          version="${{ steps.version.outputs.version }}"
          docker tag cxcreditguard:release "$IMAGE:$version"
          docker tag cxcreditguard:release "$IMAGE:latest"
          docker push "$IMAGE:$version"
          docker push "$IMAGE:latest"
          {
            echo "### Published $IMAGE:$version"
            echo ""
            echo "- signed: ${{ steps.sign.outputs.signed }}"
            echo "- dependency hash: \`${{ steps.deps.outputs.hash }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
