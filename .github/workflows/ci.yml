name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Third-party actions are pinned by full commit SHA (the tag in the comment), as
# in release.yml: a moved tag cannot change what runs with this repository's code.

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          # The interpreter the images run (python:3.13-alpine3.24).
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/constraints.txt

      - name: Install
        # The pinned versions the image is built with, not whatever is newest.
        run: pip install -c constraints.txt -e ".[dev]"

      - name: Lint
        run: |
          python -m ruff check .
          python -m ruff format --check .

      - name: Tests (SQLite)
        run: python -m pytest -q
        env:
          # A throwaway key: the suite only needs one that is well formed.
          CXCG_ENV: development
          CXCG_COOKIE_SECURE: "false"

      - name: Dependency audit
        # Fails the build on a known vulnerable dependency, direct or transitive,
        # in the pinned set the image is built from (plus the test tools).
        run: python -m pip_audit --strict -r constraints.txt

  backend-postgres:
    # The same suite against the database production actually uses. SQLite and
    # PostgreSQL disagree on locking, column widths and constraint names, and
    # every defect of that kind was invisible while only SQLite was tested.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16.16-alpine3.24@sha256:f2f98726820d0342055351c6e9d36e705f5bfffb3dd53ff556325114b08afb6d
        env:
          POSTGRES_USER: cxcg
          POSTGRES_DB: cxcg_test
          # A throwaway database that exists for this job only and is reachable
          # only from the runner: no password at all, rather than one committed
          # here and repeated in a connection URL.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cxcg -d cxcg_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          # The interpreter the images run (python:3.13-alpine3.24).
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/constraints.txt

      - name: Install
        run: pip install -c constraints.txt -e ".[dev,postgres]"

      - name: Tests (PostgreSQL)
        run: python -m pytest -q
        env:
          CXCG_ENV: development
          CXCG_COOKIE_SECURE: "false"
          CXCG_TEST_DATABASE_URL: postgresql+psycopg://cxcg@localhost:5432/cxcg_test

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        # Exactly what the lock file says, as the image build does.
        run: npm ci --no-audit --no-fund

      - name: Type check and build
        run: npm run build

  image:
    # Builds the image and then runs the documented deployment for real: the
    # app behind the TLS proxy, on PostgreSQL, with the backup service. Building
    # alone proved nothing - the image once built cleanly while being unable to
    # open a database connection.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Validate the compose file
        run: docker compose config --quiet
        env:
          # Not a secret: a throwaway placeholder so the compose `:?` guard is
          # satisfied while validating the file. Suppress the KICS
          # generic-password false positive (it matches the key name).
          # kics-scan ignore-line
          POSTGRES_PASSWORD: ci-placeholder

      - name: Build and start the stack
        run: ./deploy/ci/smoke-test.sh up

      - name: Exercise the running stack
        run: ./deploy/ci/smoke-test.sh check

      - name: Logs
        if: always()
        run: ./deploy/ci/smoke-test.sh logs

      - name: Stop the stack
        if: always()
        run: ./deploy/ci/smoke-test.sh down

      - name: Single-container image
        # The quick-start image has its own Dockerfile and entrypoint.
        run: ./deploy/ci/smoke-test.sh single
