name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: |
          python -m ruff check .
          python -m ruff format --check .

      - name: Tests
        run: python -m pytest -q
        env:
          # A throwaway key: the suite only needs one that is well formed.
          CXCG_ENV: development
          CXCG_COOKIE_SECURE: "false"

      - name: Dependency audit
        # Fails the build on a known vulnerable dependency. Audit the resolved
        # third-party requirements rather than the live environment: the latter
        # includes the local editable project (cxcreditguard), which is not on
        # PyPI and would otherwise trip --strict on every run.
        run: |
          python -m pip freeze --exclude-editable > /tmp/requirements.txt
          python -m pip_audit --strict -r /tmp/requirements.txt

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package.json

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Type check and build
        run: npm run build

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the image
        run: docker build -f backend/Dockerfile -t cxcreditguard:ci .

      - name: Validate the compose file
        run: docker compose config --quiet
        env:
          # Not a secret: a throwaway placeholder so the compose `:?` guard is
          # satisfied while validating the file. Suppress the KICS
          # generic-password false positive (it matches the key name).
          # kics-scan ignore-line
          POSTGRES_PASSWORD: ci-placeholder
