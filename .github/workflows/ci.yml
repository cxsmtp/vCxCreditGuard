name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: |
          python -m ruff check .
          python -m ruff format --check .

      - name: Tests
        run: python -m pytest -q
        env:
          # A throwaway key: the suite only needs one that is well formed.
          CXCG_ENV: development
          CXCG_COOKIE_SECURE: "false"

      - name: Dependency audit
        # Fails the build on a known vulnerable dependency.
        run: python -m pip_audit --strict

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package.json

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Type check and build
        run: npm run build

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the image
        run: docker build -f backend/Dockerfile -t cxcreditguard:ci .

      - name: Validate the compose file
        run: docker compose config --quiet
        env:
          POSTGRES_PASSWORD: ci-placeholder
