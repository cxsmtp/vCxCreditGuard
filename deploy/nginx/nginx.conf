# TLS termination and reverse proxy for CxCreditGuard.
#
# The app sets HSTS, CSP and the other security headers itself, so this file
# deliberately does not duplicate them: one owner per header avoids the case
# where a proxy default silently overrides a stricter application policy.

upstream cxcreditguard {
    server app:8000;
    keepalive 16;
}

# Plain HTTP exists only to redirect. Nothing is served over it.
server {
    listen 80;
    listen [::]:80;
    server_name _;

    location / {
        return 308 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache shared:CxCreditGuardTLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Do not advertise the nginx version.
    server_tokens off;

    # Limits generous enough for a CSV of limits, tight enough to be a limit.
    client_max_body_size 4m;
    client_body_timeout 30s;

    location / {
        proxy_pass http://cxcreditguard;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # The app treats this as a log and rate limit input only, never as an
        # authorisation input.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
    }

    # Health checks do not need to be logged on every interval.
    location = /healthz {
        access_log off;
        proxy_pass http://cxcreditguard;
        proxy_set_header Host $host;
    }
}
