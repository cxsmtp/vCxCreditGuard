# Shared Volumes Between Containers: each named volume below is mounted by a
# single service (db-data by db, app-data by app), so this is a false positive.
# kics-scan disable=8c978947-0ff6-485c-b0c2-0bfca6026466
# CxCreditGuard: app, database and TLS terminating reverse proxy.
#
#   cp .env.example .env      # then fill in CXCG_MASTER_KEY and POSTGRES_PASSWORD
#   docker compose up -d
#
# Only the proxy publishes ports. The app and database are reachable only on the
# internal compose network.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cxcreditguard}
      POSTGRES_USER: ${POSTGRES_USER:-cxcg}
      # Not a hardcoded secret: this is a ${POSTGRES_PASSWORD} reference resolved
      # from the operator's .env. Suppress the KICS generic-password false
      # positive (it matches the key name, not the value).
      # kics-scan ignore-line
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cxcg} -d ${POSTGRES_DB:-cxcreditguard}"]
      interval: 10s
      timeout: 5s
      retries: 10
    # Hardening: drop every Linux capability and grant back only the handful
    # Postgres needs to initialise its data directory and drop to its own user.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # The cap_drop: ALL above is the hardening; this is the minimal set Postgres
    # needs to initialise its data dir and drop to its user. Suppress the KICS
    # "cap_add present" false positive.
    # kics-scan ignore-line
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    networks:
      - internal

  app:
    build:
      # Repository root, so the image can build the frontend and the backend.
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      # Optional so `docker compose config` and image validation work without a
      # local .env; a real deployment still supplies it (the app fails fast at
      # startup without CXCG_MASTER_KEY).
      - path: .env
        required: false
    environment:
      # Overrides .env so the bundled Postgres is used rather than SQLite.
      CXCG_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-cxcg}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-cxcreditguard}
    volumes:
      # Only used if you switch CXCG_DATABASE_URL back to SQLite.
      - app-data:/app/data
    healthcheck:
      # The image ships no curl; probe with the bundled Python interpreter.
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    # Hardening: nothing in the container writes outside /app/data and /tmp.
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - internal

  proxy:
    # The -slim variant drops the xslt/image-filter/geoip modules (and their
    # libxml2/libxslt/libgd dependencies, a recurring source of CVEs) that this
    # plain reverse-proxy config never uses.
    image: nginx:1.27-alpine-slim
    restart: unless-stopped
    depends_on:
      - app
    # A public TLS reverse proxy must publish 80/443 on the host interface; the
    # privileged-ports and host-interface-binding findings below are intended,
    # not misconfigurations.
    # kics-scan ignore-block
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # Place fullchain.pem and privkey.pem here. See deploy/nginx/README.md.
      - ./deploy/nginx/certs:/etc/nginx/certs:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "--no-check-certificate", "https://localhost/healthz"]
      interval: 30s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true
    # Drop every capability and grant back only those nginx needs to bind the
    # privileged ports and run its workers as an unprivileged user.
    cap_drop:
      - ALL
    # cap_drop: ALL above is the hardening; this is the minimal set nginx needs.
    # Suppress the KICS "cap_add present" false positive.
    # kics-scan ignore-line
    cap_add:
      - NET_BIND_SERVICE
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
    networks:
      - internal

volumes:
  db-data:
  app-data:

networks:
  internal:
    driver: bridge
