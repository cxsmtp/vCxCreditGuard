# Shared Volumes Between Containers: each named volume below is mounted by a
# single service (db-data by db, db-backups by backup, app-data by app), so this
# is a false positive.
# kics-scan disable=8c978947-0ff6-485c-b0c2-0bfca6026466
# CxCreditGuard: app, database and TLS terminating reverse proxy.
#
#   cp .env.example .env      # then fill in CXCG_MASTER_KEY and POSTGRES_PASSWORD
#   docker compose up -d
#
# Only the proxy publishes ports. The app and database are reachable only on the
# internal compose network.

# Container logs are kept on the host by the default driver without any limit.
# Cap them so a noisy week cannot fill the disk.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *default-logging
    # A ceiling, not a reservation: enough for this workload, and a bound on
    # what a runaway query or leak can take from the host. (No CPU ceiling: the
    # container runtime refuses to start a container whose ceiling is above the
    # host's core count, which would make a one-core host a broken install.)
    mem_limit: 1g
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cxcreditguard}
      POSTGRES_USER: ${POSTGRES_USER:-cxcg}
      # Not a hardcoded secret: this is a ${POSTGRES_PASSWORD} reference resolved
      # from the operator's .env. Suppress the KICS generic-password false
      # positive (it matches the key name, not the value).
      # kics-scan ignore-line
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cxcg} -d ${POSTGRES_DB:-cxcreditguard}"]
      interval: 10s
      timeout: 5s
      retries: 10
    # Hardening: drop every Linux capability and grant back only the handful
    # Postgres needs to initialise its data directory and drop to its own user.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # The cap_drop: ALL above is the hardening; this is the minimal set Postgres
    # needs to initialise its data dir and drop to its user. Suppress the KICS
    # "cap_add present" false positive.
    # kics-scan ignore-line
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    networks:
      - internal

  # Scheduled dumps of the database into the db-backups volume. The database
  # holds the undo snapshots for every restriction applied in Checkmarx One, so
  # losing it means losing the ability to give that access back automatically.
  # See "Backup and restore" in the README, and copy the dumps off this host.
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGDATABASE: ${POSTGRES_DB:-cxcreditguard}
      PGUSER: ${POSTGRES_USER:-cxcg}
      # A ${POSTGRES_PASSWORD} reference from the operator's .env, not a
      # hardcoded secret (KICS matches the key name).
      # kics-scan ignore-line
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    entrypoint: ["/bin/sh", "/usr/local/bin/backup.sh"]
    volumes:
      - ./deploy/backup/backup.sh:/usr/local/bin/backup.sh:ro
      - ./deploy/backup/restore.sh:/usr/local/bin/restore.sh:ro
      - db-backups:/backups
    mem_limit: 256m
    cpus: 0.5
    # Runs as the image's default user (root) with every capability dropped:
    # the named volume's directory is owned by root, and writing to a directory
    # you own needs no capability.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - internal

  app:
    build:
      # Repository root, so the image can build the frontend and the backend.
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    logging: *default-logging
    # Exactly one app container: the scheduler and its locks live in this one
    # process, and a second instance against the same database refuses to start.
    mem_limit: 1g
    depends_on:
      db:
        condition: service_healthy
    env_file:
      # Optional so `docker compose config` and image validation work without a
      # local .env; a real deployment still supplies it (the app fails fast at
      # startup without CXCG_MASTER_KEY).
      - path: .env
        required: false
    environment:
      # Overrides .env so the bundled Postgres is used rather than SQLite.
      CXCG_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-cxcg}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-cxcreditguard}
      # The bundled nginx is the one proxy in front of the app. It overwrites
      # X-Forwarded-For with the address it saw, and the app trusts exactly that
      # one entry for sign-in throttling and audit. Change it here only if you
      # put another load balancer in front of nginx (see deploy/nginx/README.md).
      # Set here, not taken from .env: a stray CXCG_TRUSTED_PROXY_HOPS=0 there
      # would make every client look like the proxy, so one person's failed
      # sign-ins would lock everybody out.
      CXCG_TRUSTED_PROXY_HOPS: "1"
    volumes:
      # Only used if you switch CXCG_DATABASE_URL back to SQLite.
      - app-data:/app/data
    healthcheck:
      # The image ships no curl; probe with the bundled Python interpreter.
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    # Hardening: nothing in the container writes outside /app/data and /tmp.
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - internal

  proxy:
    # The -slim variant drops the xslt/image-filter/geoip modules (and their
    # libxml2/libxslt/libgd dependencies, a recurring source of CVEs) that this
    # plain reverse-proxy config never uses.
    image: nginx:1.27-alpine-slim
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 256m
    cpus: 1.0
    # Started once the app answers its health check: nginx resolves the upstream
    # when it starts, and would otherwise crash-loop while the app is still
    # applying migrations.
    depends_on:
      app:
        condition: service_healthy
    # A public TLS reverse proxy must publish 80/443 on the host interface; the
    # privileged-ports and host-interface-binding findings below are intended,
    # not misconfigurations.
    # kics-scan ignore-block
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # Place fullchain.pem and privkey.pem here. See deploy/nginx/README.md.
      - ./deploy/nginx/certs:/etc/nginx/certs:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "--no-check-certificate", "https://localhost/healthz"]
      interval: 30s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true
    # Drop every capability and grant back only those nginx needs to bind the
    # privileged ports and run its workers as an unprivileged user.
    cap_drop:
      - ALL
    # cap_drop: ALL above is the hardening; this is the minimal set nginx needs.
    # Suppress the KICS "cap_add present" false positive.
    # kics-scan ignore-line
    cap_add:
      - NET_BIND_SERVICE
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
    networks:
      - internal

volumes:
  db-data:
  db-backups:
  app-data:

networks:
  internal:
    driver: bridge
